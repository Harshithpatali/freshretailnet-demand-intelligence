name: Backtest FreshRetailNet Inventory Policies

on:
  workflow_dispatch:
    inputs:
      lead_time_days:
        description: Supplier lead time in days
        required: true
        default: "1"
      review_period_days:
        description: Inventory review period in days
        required: true
        default: "1"
      initial_stock_units:
        description: Initial stock per store-product series
        required: true
        default: "0"
      holding_cost_per_unit_day:
        description: Holding cost per unit per day (assumption)
        required: true
        default: "0.05"
      shortage_penalty_per_unit:
        description: Shortage penalty per unit (assumption)
        required: true
        default: "2.0"
      ordering_cost_per_order:
        description: Fixed cost per replenishment order (assumption)
        required: true
        default: "5.0"

permissions:
  contents: read

jobs:
  inventory-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inventory simulation dependencies
        run: python -m pip install --upgrade boto3 pandas numpy
      - name: Simulate P50 and P90 replenishment policies
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          LEAD_TIME_DAYS: ${{ inputs.lead_time_days }}
          REVIEW_PERIOD_DAYS: ${{ inputs.review_period_days }}
          INITIAL_STOCK_UNITS: ${{ inputs.initial_stock_units }}
          HOLDING_COST_PER_UNIT_DAY: ${{ inputs.holding_cost_per_unit_day }}
          SHORTAGE_PENALTY_PER_UNIT: ${{ inputs.shortage_penalty_per_unit }}
          ORDERING_COST_PER_ORDER: ${{ inputs.ordering_cost_per_order }}
        run: python src/simulate_inventory.py
