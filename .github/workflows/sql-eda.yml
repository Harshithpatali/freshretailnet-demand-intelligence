name: FreshRetailNet SQL and full dataset EDA

on:
  push:
    branches: [main]
    paths:
      - "scripts/sql_eda.py"
      - "scripts/full_dataset_eda.py"
      - ".github/workflows/sql-eda.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql-eda:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SQL and storage dependencies
        run: python -m pip install --upgrade boto3 duckdb
      - name: Execute SQL EDA and publish results to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/sql_eda.py
      - name: Build complete 19-field EDA from train and evaluation Parquet
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/full_dataset_eda.py
