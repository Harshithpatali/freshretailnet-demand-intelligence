name: Demand Censoring Sensitivity

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/demand_censoring_sensitivity.py"
      - ".github/workflows/demand-censoring-sensitivity.yml"

permissions:
  contents: read

jobs:
  censoring-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade boto3 polars pyarrow pandas numpy
      - name: Compile diagnostic
        run: python -m py_compile scripts/demand_censoring_sensitivity.py
      - name: Build historical in-stock hourly rates and held-out sensitivity
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -u scripts/demand_censoring_sensitivity.py
