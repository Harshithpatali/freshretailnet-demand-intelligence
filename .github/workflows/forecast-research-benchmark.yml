name: Forecast Research Benchmark (STL, Fourier, Spectral, Wavelet, Residual, Ensemble)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/stochastic-inventory-and-forecast-research
    paths:
      - "experiments/forecast_research/**"
      - "experiments/wavelet/features.py"
      - "src/train_model.py"
      - ".github/workflows/forecast-research-benchmark.yml"

concurrency:
  group: forecast-research-benchmark-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install forecasting research dependencies
        run: python -m pip install --upgrade boto3 lightgbm polars pandas numpy scipy statsmodels PyWavelets scikit-learn pyarrow
      - name: Compile research benchmark
        run: python -m py_compile experiments/forecast_research/forecast_research_benchmark.py
      - name: Run rolling, ablation, residual and ensemble benchmark
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FORECAST_RESEARCH_SERIES_SAMPLE: "3000"
          FORECAST_RESEARCH_BOOTSTRAP_REPS: "300"
        run: python -u experiments/forecast_research/forecast_research_benchmark.py
