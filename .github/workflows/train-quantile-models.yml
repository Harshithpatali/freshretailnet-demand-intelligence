name: Train FreshRetailNet Quantile Forecasts

on:
  workflow_dispatch:
  push:
    paths:
      - "src/train_quantile_models.py"
      - ".github/workflows/train-quantile-models.yml"

permissions:
  contents: read

jobs:
  train-quantiles:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install quantile modelling dependencies
        run: python -m pip install --upgrade boto3 polars pyarrow pandas numpy lightgbm scikit-learn
      - name: Train P10 P50 P90 models, evaluate intervals, and publish to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python src/train_quantile_models.py
