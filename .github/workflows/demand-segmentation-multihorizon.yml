name: Demand Segmentation and Multi-Horizon Forecasting

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/demand_intelligence/segment_multihorizon.py"
      - "src/train_model.py"
      - ".github/workflows/demand-segmentation-multihorizon.yml"

permissions:
  contents: read

jobs:
  demand-segmentation-multihorizon:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade boto3 polars pyarrow pandas numpy scikit-learn lightgbm
      - name: Compile experiment
        run: python -m py_compile experiments/demand_intelligence/segment_multihorizon.py src/train_model.py
      - name: Run demand segmentation and direct multi-horizon experiment
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python experiments/demand_intelligence/segment_multihorizon.py
