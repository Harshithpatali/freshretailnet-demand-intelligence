name: API and dashboard quality checks

on:
  push:
    paths:
      - "api/**"
      - "dashboard/**"
      - "tests/**"
      - "src/**"
      - "scripts/**"
      - "experiments/**"
      - ".github/workflows/app-quality.yml"
  pull_request:
    paths:
      - "api/**"
      - "dashboard/**"
      - "tests/**"
      - ".github/workflows/app-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API and dashboard dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r dashboard/requirements.txt pytest
      - name: Compile Python modules
        run: python -m compileall -q api dashboard src scripts experiments tests
      - name: Run offline data contract tests
        run: pytest -q tests
