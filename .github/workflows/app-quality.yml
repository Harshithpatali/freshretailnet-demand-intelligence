name: API and dashboard quality checks

on:
  push:
    paths:
      - "api/**"
      - "dashboard/**"
      - "tests/**"
      - "src/**"
      - "scripts/**"
      - "experiments/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/app-quality.yml"
  pull_request:
    paths:
      - "api/**"
      - "dashboard/**"
      - "tests/**"
      - "src/**"
      - "scripts/**"
      - "experiments/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/app-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API and dashboard dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r dashboard/requirements.txt pytest ruff
      - name: Compile Python modules
        run: python -m compileall -q api dashboard src scripts experiments tests
      - name: Run Ruff static checks
        run: ruff check --select F --target-version py311 api dashboard tests scripts/run_small_demo.py
      - name: Run offline API and forecasting tests
        run: pytest -q tests
