name: Profile and Process FreshRetailNet-50K in R2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process:
    name: Validate, profile, and write processed data to R2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install processing dependencies
        run: python -m pip install --upgrade boto3 polars pyarrow

      - name: Process datasets and upload outputs to the same R2 bucket
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/profile_and_process_r2.py
