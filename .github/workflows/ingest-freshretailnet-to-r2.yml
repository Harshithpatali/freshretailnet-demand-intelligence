name: Ingest FreshRetailNet-50K to Cloudflare R2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    name: Download from Hugging Face and upload to R2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ingestion dependencies
        run: python -m pip install --upgrade huggingface_hub boto3

      - name: Download, checksum, and upload Parquet files
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/ingest_freshretailnet_to_r2.py
