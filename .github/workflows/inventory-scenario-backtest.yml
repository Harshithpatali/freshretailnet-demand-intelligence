name: Inventory Lead-Time and Constraint Scenarios

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/inventory_scenario_backtest.py"
      - "src/simulate_inventory.py"
      - ".github/workflows/inventory-scenario-backtest.yml"

permissions:
  contents: read

jobs:
  scenario-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade boto3 pandas numpy
      - name: Compile simulator and scenario runner
        run: python -m py_compile src/simulate_inventory.py scripts/inventory_scenario_backtest.py
      - name: Run lead-time, review-cycle, storage and order-constraint grid
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -u scripts/inventory_scenario_backtest.py
