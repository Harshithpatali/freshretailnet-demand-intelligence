name: Forecast Quality and Drift Monitoring

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/forecast_monitoring.py"
      - ".github/workflows/forecast-monitoring.yml"
      - "src/train_quantile_models.py"

concurrency:
  group: forecast-monitoring-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  forecast-monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade boto3 pandas numpy
      - name: Compile monitoring report
        run: python -m py_compile scripts/forecast_monitoring.py
      - name: Evaluate forecast quality, interval coverage and temporal drift
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -u scripts/forecast_monitoring.py
